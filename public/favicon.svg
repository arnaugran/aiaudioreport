<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Fader Report">
  <rect width="32" height="32" rx="7" fill="#16181c"/>
  <!-- three channel faders, the middle one pushed up -->
  <g stroke="#52575f" stroke-width="2.5" stroke-linecap="round">
    <line x1="9" y1="7" x2="9" y2="25"/>
    <line x1="16" y1="7" x2="16" y2="25"/>
    <line x1="23" y1="7" x2="23" y2="25"/>
  </g>
  <g fill="#f0945c">
    <rect x="5.5" y="17" width="7" height="4" rx="1.4"/>
    <rect x="12.5" y="9.5" width="7" height="4" rx="1.4"/>
    <rect x="19.5" y="15" width="7" height="4" rx="1.4"/>
  </g>
</svg>
