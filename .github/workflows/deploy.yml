name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://aiaudioreport.com
      BASE_PATH: /
      # PUBLIC_GA4_ID: set as a repository variable once a GA4 property exists.
      PUBLIC_GA4_ID: ${{ vars.PUBLIC_GA4_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    # Pings Bing (and DuckDuckGo/Ecosia through it) about changed articles.
    # Runs after deploy so the key file is already live. Never blocks a deploy.
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sleep 30
      - run: node scripts/indexnow.mjs "${{ github.event.before }}" "${{ github.sha }}"
